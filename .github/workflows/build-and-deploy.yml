name: Deploy Images to GHCR

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

# Required permissions for signing with Cosign
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - desktop: kde
            base_image: quay.io/fedora-ostree-desktops/kinoite
            tag: kde
            gaming: false
          - desktop: kde
            base_image: quay.io/fedora-ostree-desktops/kinoite
            tag: kde-gaming
            gaming: true
          - desktop: gnome
            base_image: quay.io/fedora-ostree-desktops/silverblue
            tag: gnome
            gaming: false
          - desktop: gnome
            base_image: quay.io/fedora-ostree-desktops/silverblue
            tag: gnome-gaming
            gaming: true
          - desktop: cosmic
            base_image: quay.io/fedora-ostree-desktops/cosmic-atomic
            tag: cosmic
            gaming: false
          - desktop: cosmic
            base_image: quay.io/fedora-ostree-desktops/cosmic-atomic
            tag: cosmic-gaming
            gaming: true
    defaults:
      run:
        working-directory: '.'
    steps:
      - name: 'Maximize build space'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Install Cosign'
        uses: sigstore/cosign-installer@v4.1.2

      - name: 'Delete huge unnecessary tools folder'
        run: rm -rf /opt/hostedtoolcache

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build Image'
        run: |
          source ENVAR
          IMAGE="ghcr.io/m-fe02/fe02-os:${{ matrix.tag }}"
          podman build \
            --build-arg FEDORA_MAJOR_VERSION=${MAJOR_VERSION} \
            --build-arg BASE_IMAGE_NAME=${{ matrix.base_image }} \
            --build-arg DESKTOP_ENV=${{ matrix.desktop }} \
            --build-arg GAMING=${{ matrix.gaming }} \
            --tag "${IMAGE}" \
            -f Containerfile

      # Distro-agnostic OCI rechunker: https://github.com/coreos/chunkah
      # Splits the image into content-addressed layers for smaller delta
      # updates. Ported from ublue-os/image-template's Justfile `rechunk`
      # recipe. Makes a near-full copy of the image, so watch runner disk
      # space if this starts failing.
      - name: 'Rechunk with Chunkah'
        run: |
          IMAGE="ghcr.io/m-fe02/fe02-os:${{ matrix.tag }}"
          CHUNKAH_CONFIG_FILE="$(mktemp)"
          CHUNKAH_OUTPUT_DIR="$(mktemp -d ./chunkah_XXXXXX)"
          trap 'rm -f "${CHUNKAH_CONFIG_FILE}"; rm -rf "${CHUNKAH_OUTPUT_DIR}"' EXIT

          podman inspect "${IMAGE}" > "${CHUNKAH_CONFIG_FILE}"

          podman run --rm \
            --mount=type=image,src="${IMAGE}",target=/chunkah \
            -v "${CHUNKAH_CONFIG_FILE}:/chunkah-config.json:ro,Z" \
            -v "${CHUNKAH_OUTPUT_DIR}:/run/out:Z" \
            quay.io/coreos/chunkah:latest \
            build \
            --verbose \
            --compressed \
            --max-layers 128 \
            --prune /sysroot/ \
            --label ostree.commit- --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          CHUNKED_IMAGE="$(podman pull "oci:${CHUNKAH_OUTPUT_DIR}/chunked")"
          podman tag "${CHUNKED_IMAGE}" "${IMAGE}"

      - name: 'Push Image'
        id: push
        run: |
          IMAGE="ghcr.io/m-fe02/fe02-os:${{ matrix.tag }}"
          podman push --digestfile /tmp/digest "${IMAGE}"
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
          podman system prune -a -f

      - name: 'Sign Image'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "ghcr.io/m-fe02/fe02-os@${{ steps.push.outputs.digest }}"
